<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth Filter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --accent: #000000;
            --accent-hover: #333333;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 500px; 
            text-align: center;
        }

        h2 { 
            font-weight: 600;
            font-size: 24px;
            margin: 0 0 5px 0; 
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 30px;
        }

        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 15px; 
            border: 1px solid #e1e1e1; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-weight: 400;
            font-size: 15px;
            resize: none; 
            margin-bottom: 20px;
            background-color: #fafafa;
            transition: border 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            font-family: inherit;
            font-weight: 600;
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%;
            transition: all 0.2s ease; 
        }

        button:hover { 
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .result { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 400;
            display: none; /* Hidden by default */
            justify-content: space-between;
            align-items: center;
        }
        
        .result span { font-weight: 600; font-size: 18px; }
        .result.Fake { display: flex; background-color: #fff0f0; color: #d32f2f; } 
        .result.Real { display: flex; background-color: #f0fdf4; color: #16a34a; } 
        
        .error { color: #d32f2f; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verify</h2>
        <p class="subtitle">Analyze text for authenticity</p>
        
        <form id="analyzerForm">
            <textarea id="newsText" placeholder="Paste article text here..." required></textarea>
            <button type="submit" id="submitBtn">Analyze</button>
        </form>

        <p class="error" id="errorBlock"></p>

        <div class="result" id="resultBlock">
            <span id="labelOutput"></span>
            <div id="confidenceOutput"></div>
        </div>
    </div>

    <script>
        document.getElementById('analyzerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const text = document.getElementById('newsText').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultBlock = document.getElementById('resultBlock');
            const errorBlock = document.getElementById('errorBlock');

            // Reset UI states
            errorBlock.style.display = 'none';
            resultBlock.className = 'result'; // Clear Fake/Real classes
            submitBtn.textContent = 'Analyzing...';
            submitBtn.disabled = true;

            try {
                // Fetching data directly from your running background Flask app
                const response = await fetch('http://127.0.0.1:5000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ news_text: text })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server error occurred.');
                }

                // Update and show results block
                document.getElementById('labelOutput').textContent = data.display_label;
                document.getElementById('confidenceOutput').textContent = `${(data.score * 100).toFixed(1)}% confident`;
                resultBlock.classList.add(data.display_label);

            } catch (err) {
                errorBlock.textContent = err.message;
                errorBlock.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Analyze';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
